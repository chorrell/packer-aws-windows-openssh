name: Lint Markdown Files

on:
  pull_request:
    paths:
      - '**/*.md'
      - '.github/workflows/markdownlint.yml'
  push:
    branches:
      - main
    paths:
      - '**/*.md'
      - '.github/workflows/markdownlint.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdownlint:
    uses: chorrell/workflows/.github/workflows/markdownlint.yml@v1
