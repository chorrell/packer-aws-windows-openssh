name: Run PSScriptAnalyzer on PowerShell Scripts

on:
  pull_request:
    paths:
      - '**.ps1'
      - 'PSScriptAnalyzerSettings.psd1'
      - '.github/workflows/PSScriptAnalyzer.yml'
  push:
    branches:
      - main
    paths:
      - '**.ps1'
      - 'PSScriptAnalyzerSettings.psd1'
      - '.github/workflows/PSScriptAnalyzer.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  PSScriptAnalyzer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The pinned PSScriptAnalyzer version is preinstalled on ubuntu-latest;
      # the script only installs it if the runner image changes.
      - name: Run PSScriptAnalyzer on PowerShell Scripts
        shell: pwsh
        run: ./scripts/Invoke-PSScriptAnalyzer.ps1
