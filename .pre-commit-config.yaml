repos:
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2-docker

  - repo: https://github.com/cisagov/pre-commit-packer
    rev: v0.3.1
    hooks:
      - id: packer_fmt

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/woodruffw/zizmor-pre-commit
    rev: v1.29.0
    hooks:
      - id: zizmor

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # No local pwsh needed. The image has no multi-arch manifest, so pin amd64
  # (runs under Rosetta/QEMU on arm64 hosts). HOME=/tmp gives the non-root
  # container user somewhere to install PSScriptAnalyzer.
  - repo: local
    hooks:
      - id: psscriptanalyzer
        name: PSScriptAnalyzer
        language: docker_image
        entry: >-
          --platform linux/amd64 -e HOME=/tmp
          mcr.microsoft.com/powershell:7.5-ubuntu-24.04
          pwsh -NoProfile -NonInteractive -File scripts/Invoke-PSScriptAnalyzer.ps1
        files: \.ps(d|m)?1$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^files/.*\.ps1$
      - id: end-of-file-fixer
        exclude: ^files/.*\.ps1$
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: mixed-line-ending
        args: ["--fix=no"]
        exclude: ^files/.*\.ps1$
